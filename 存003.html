<html><head>
    <style>
        body{
            margin:0;
            height:100vh;
            background-color:#eee;
        }
        .yinying{
            box-shadow:7px 3px 3px #A9A9A9;
        }
/*
        *{
            border:1px solid black
        }
*/
        .flex{
            display:flex;
        }
        .baise{
background-color:white;
        }
        .flex1{
            flex:1;
        }
    .column{
        flex-direction:column;
    }
.mg8{
margin:8px;
}
.mgr8{
margin-right:8px;
}
.mgt8{
margin-top:8px;
}
    </style>
</head><body class="flex">
    <!--侧边-->
    <div style="width:200px;z-index:2;" class="baise mgr8 yinying"></div>
    <!--主内-->
    <div class="flex1 flex column">
        <!--头部-->
        <div style="height:100px;margin-left:8px;z-index:1;" class="baise yinying"></div>
        <!--内容-->
        <div style="overflow:auto" class="flex1 flex">
            <!--主内容-->
            <div style="flex:3" class="flex column mg8">
                <!--上消息-->
                <div class="flex">
                     <div style="height:100px" class="flex1 baise mgr8 yinying"></div>
                    <div style="height:100px" class="flex1 baise mgr8 yinying"></div>
                    <div style="height:100px" class="flex1 baise mgr8 yinying"></div>
                    <div style="height:100px" class="flex1 baise yinying"></div>
                </div>
                <!--主内容-->
                <div class="flex column">
                    
                    <div style="height:160px" class="baise mgt8 yinying"></div><div style="height:160px" class="baise mgt8 yinying"></div>
                    
                    <div style="height:160px" class="baise mgt8 yinying"></div><div style="height:160px" class="baise mgt8 yinying"></div>
                    
                    <div style="height:160px" class="baise mgt8 yinying"></div><div style="height:160px" class="baise mgt8 yinying"></div>
                </div>
            </div>
            <!--右内容-->
            <div style="flex:1;margin-top:0px;" class="flex column mg8">
                <!--上消息-->
                <div style="height:150px" class="baise mgt8 mg8 yinying"></div>
                <!--主内容-->
                <div style="height:300px" class="baise mgt8 mg8 yinying"></div>
            </div>
        </div>
    </div>
</body></html>
